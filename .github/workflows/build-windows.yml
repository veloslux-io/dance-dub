name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Runs on a self-hosted Windows runner (see README "Building the Windows app").
# To use GitHub's cloud runner instead, change the line below to:
#   runs-on: windows-latest
# (note: private repos burn Actions minutes 2x on Windows cloud runners)
# All script steps use the built-in Windows PowerShell, so the runner needs
# nothing installed beyond what setup-python provides.
jobs:
  build:
    runs-on: [self-hosted, Windows]
    # The exe under test uses its own port and opens no browser, so it can't
    # collide with (or talk to) a copy of Dance Dub already open on the runner.
    env:
      DANCE_DUB_PORT: "18756"
      DANCE_DUB_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        shell: powershell
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: pyinstaller dance-dub.spec --noconfirm --clean

      - name: Smoke-test the exe (server starts, index serves)
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "dist\DanceDub\DanceDub.exe" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$env:DANCE_DUB_PORT/api/defaults" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Smoke test failed: server never responded"
          }
          # The Quit button must actually end the background process.
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$env:DANCE_DUB_PORT/api/quit" -Body "{}" | Out-Null
          if (-not $proc.WaitForExit(10000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Smoke test failed: /api/quit did not stop DanceDub.exe"
          }
          Write-Host "Smoke test OK - DanceDub.exe serving on 127.0.0.1:$env:DANCE_DUB_PORT"

      - name: End-to-end test (transcribe, translate, burn a spoken clip)
        shell: powershell
        timeout-minutes: 20
        run: |
          # Runs the whole pipeline inside the packaged exe, the way a user would,
          # so missing bundled data (models, DLLs) fails the build, not the user.
          $tmp = Join-Path $env:RUNNER_TEMP "e2e"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile("$tmp\speech.wav")
          $tts.Speak("Step forward with your left foot. Now turn around and clap your hands twice.")
          $tts.Dispose()
          $ffmpeg = (Get-ChildItem "dist\DanceDub\_internal\imageio_ffmpeg\binaries\ffmpeg*.exe" | Select-Object -First 1).FullName
          & $ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=320x240:r=25 -i "$tmp\speech.wav" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$tmp\e2e-test.mp4"
          if ($LASTEXITCODE -ne 0) { throw "could not create test video" }

          $proc = Start-Process -FilePath "dist\DanceDub\DanceDub.exe" -PassThru
          try {
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try { Invoke-WebRequest -Uri "http://127.0.0.1:$env:DANCE_DUB_PORT/api/defaults" -UseBasicParsing -TimeoutSec 3 | Out-Null; break } catch {}
            }
            $body = @{ mode = "file"; path = "$tmp\e2e-test.mp4"; output = "$tmp\out"; model = "tiny"; target_lang = "es" } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$env:DANCE_DUB_PORT/api/start" -ContentType "application/json" -Body $body | Out-Null
            $snap = $null
            foreach ($i in 1..360) {
              Start-Sleep -Seconds 3
              $snap = Invoke-RestMethod -Uri "http://127.0.0.1:$env:DANCE_DUB_PORT/api/status"
              if (-not $snap.status.running -and ($snap.status.done -or $snap.status.error)) { break }
            }
            $snap.log | ForEach-Object { Write-Host $_ }
            if (-not $snap.status.done) { throw "End-to-end run failed: $($snap.status.error)" }
            $srt = Get-ChildItem "$tmp\out" -Recurse -Filter "transcript.srt" | Select-Object -First 1
            if (-not $srt -or (Get-Content $srt.FullName -Raw).Trim().Length -eq 0) { throw "No transcript was produced" }
            Write-Host "--- transcript.srt ---"
            Get-Content $srt.FullName | Write-Host
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package zip
        shell: powershell
        run: |
          # README for inside the zip
          @"
          Dance Dub
          =========

          1. Unzip this folder anywhere (e.g. C:\Tools\DanceDub) and keep all files together.
          2. Double-click DanceDub.exe. Your browser opens the app.
             (If Windows SmartScreen appears: More info -> Run anyway. The app is
              unsigned; it only talks to 127.0.0.1 on your own machine.)
          3. Paste a Wix video page URL, or switch to "From a file on this PC"
             and drop a video in. Pick a language, press Start.
          4. When you're done, click Quit (top right of the page). Dance Dub keeps
             running in the background until you do.

          First transcription downloads the AI model once (~460 MB), then it's cached.
          Everything runs locally: nothing is uploaded anywhere.

          Output lands in: <your user folder>\DanceDub\Videos\<video name>\
          "@ | Out-File -FilePath dist\DanceDub\READ-ME-FIRST.txt -Encoding utf8
          Compress-Archive -Path dist\DanceDub\* -DestinationPath DanceDub-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanceDub-windows
          path: DanceDub-windows.zip

      - name: Attach to release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DanceDub-windows.zip
